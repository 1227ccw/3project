<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026학년도 한가람 체육활동 안내</title>
  <style>
    :root {
      --primary-color: #ff6b6b;
      --bg-color: #f7f9fc;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      
      /* 학년별 테마 색상 */
      --grade3-color: #3f51b5;
      --grade3-light: #e8eaf6;
      --grade2-color: #2e7d32;
      --grade2-light: #e8f5e9;
      --grade1-color: #e65100;
      --grade1-light: #fff3e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      padding: 16px;
      flex: 1;
    }

    /* 헤더 & D-Day */
    header {
      background: linear-gradient(135deg, #ff8e53, #ff6b6b);
      color: white;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.25);
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    header .event-info {
      font-size: 0.95rem;
      opacity: 0.95;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .dday-badge {
      display: inline-block;
      background-color: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(5px);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* 탭 메뉴 */
    .tab-menu {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background-color: #e2e8f0;
      padding: 6px;
      border-radius: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: none;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-sub);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background-color: white;
      color: var(--primary-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 학년 선택 버튼 */
    .grade-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .grade-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid transparent;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background-color: #edf2f7;
      color: var(--text-sub);
      transition: all 0.2s ease;
    }

    .grade-btn[data-grade="3"].active {
      background-color: var(--grade3-light);
      color: var(--grade3-color);
      border-color: var(--grade3-color);
    }
    .grade-btn[data-grade="2"].active {
      background-color: var(--grade2-light);
      color: var(--grade2-color);
      border-color: var(--grade2-color);
    }
    .grade-btn[data-grade="1"].active {
      background-color: var(--grade1-light);
      color: var(--grade1-color);
      border-color: var(--grade1-color);
    }

    /* 타임라인 스타일 */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timeline-item {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 6px solid #cbd5e0;
    }

    .timeline-item.grade-3 { border-left-color: var(--grade3-color); }
    .timeline-item.grade-2 { border-left-color: var(--grade2-color); }
    .timeline-item.grade-1 { border-left-color: var(--grade1-color); }

    .time-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .location-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      background-color: #edf2f7;
      color: #4a5568;
    }

    .event-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* 점수표 & 결과 계산 탭 */
    .card-box {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }

    .card-box h3 {
      margin-bottom: 8px;
      font-size: 1.15rem;
      color: #1a202c;
    }

    .score-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .score-table th, .score-table td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid #edf2f7;
      font-size: 0.88rem;
    }

    .score-table th {
      background-color: #f8fafc;
      font-weight: 700;
      color: #4a5568;
    }

    .rank-select {
      width: 100%;
      padding: 6px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-weight: 700;
      background: #fff;
    }

    .total-score-board {
      display: flex;
      gap: 10px;
      margin-top: 15
