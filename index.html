<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026학년도 한가람 체육활동 안내</title>
  <style>
    :root {
      --primary-color: #ff6b6b;
      --bg-color: #f7f9fc;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      
      --grade3-color: #3f51b5;
      --grade3-light: #e8eaf6;
      --grade2-color: #2e7d32;
      --grade2-light: #e8f5e9;
      --grade1-color: #e65100;
      --grade1-light: #fff3e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 16px;
      flex: 1;
    }

    /* 헤더 및 D-Day */
    header {
      background: linear-gradient(135deg, #ff8e53, #ff6b6b);
      color: white;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.25);
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    header .event-info {
      font-size: 0.95rem;
      opacity: 0.95;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .dday-badge {
      display: inline-block;
      background-color: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(5px);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* 탭 메뉴 */
    .tab-menu {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background-color: #e2e8f0;
      padding: 6px;
      border-radius: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: none;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-sub);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background-color: white;
      color: var(--primary-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 학년 선택 버튼 */
    .grade-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .grade-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid transparent;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background-color: #edf2f7;
      color: var(--text-sub);
      transition: all 0.2s ease;
    }

    .grade-btn[data-grade="3"].active {
      background-color: var(--grade3-light);
      color: var(--grade3-color);
      border-color: var(--grade3-color);
    }
    .grade-btn[data-grade="2"].active {
      background-color: var(--grade2-light);
      color: var(--grade2-color);
      border-color: var(--grade2-color);
    }
    .grade-btn[data-grade="1"].active {
      background-color: var(--grade1-light);
      color: var(--grade1-color);
      border-color: var(--grade1-color);
    }

    /* 타임라인 카드 */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timeline-item {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 6px solid #cbd5e0;
    }

    .timeline-item.grade-3 { border-left-color: var(--grade3-color); }
    .timeline-item.grade-2 { border-left-color: var(--grade2-color); }
    .timeline-item.grade-1 { border-left-color: var(--grade1-color); }

    .time-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .location-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      background-color: #edf2f7;
      color: #4a5568;
    }

    .event-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* 결과 & 카드 디자인 */
    .card-box {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }

    .card-box h3 {
      margin-bottom: 8px;
      font-size: 1.15rem;
      color: #1a202c;
    }

    /* 관리자 인증 폼 */
    .auth-box {
      text-align: center;
      padding: 30px 20px;
    }

    .auth-box input[type="password"] {
      padding: 12px;
      width: 220px;
      border: 2px solid #cbd5e0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      margin-right: 8px;
    }

    .auth-box button {
      padding: 12px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .table-responsive {
      overflow-x: auto;
      margin-top: 12px;
    }

    .score-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    .score-table th, .score-table td {
      padding: 10px 6px;
      text-align: center;
      border-bottom: 1px solid #edf2f7;
      font-size: 0.85rem;
    }

    .score-table th {
      background-color: #f8fafc;
      font-weight: 700;
      color: #4a5568;
      white-space: nowrap;
    }

    .rank-select {
      width: 100%;
      padding: 6px 2px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-weight: 700;
      background: #fff;
      font-size: 0.85rem;
    }

    .total-score-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .class-score-card {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 4px;
      text-align: center;
    }

    .class-score-card.rank-1 {
      border-color: #ff6b6b;
      background-color: #fff5f5;
    }

    .class-score-card .class-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #4a5568;
    }

    .class-score-card .score-num {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-top: 4px;
    }

    /* 규칙 아코디언 */
    .rule-accordion {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rule-item {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      border: 1px solid #edf2f7;
    }

    .rule-header {
      padding: 16px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fff;
    }

    .rule-content {
      display: none;
      padding: 16px;
      background-color: #f8fafc;
      border-top: 1px solid #edf2f7;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #4a5568;
    }

    .rule-item.active .rule-content {
      display: block;
    }

    .rule-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      background: #e2e8f0;
      color: #4a5568;
      margin-right: 6px;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 600;
      width: 100%;
    }

    @media (min-width: 768px) {
      header h1 { font-size: 2.2rem; }
      .container { padding: 24px; }
      .tab-btn { font-size: 1.1rem; padding: 14px 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 -->
    <header>
      <h1 id="event-title"></h1>
      <div class="event-info" id="event-info"></div>
      <div class="dday-badge" id="dday-badge">D-DAY 계산 중...</div>

    <!-- 메인 탭 메뉴 -->
    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('schedule')">일정</button>

      <button class="tab-btn" onclick="switchTab('rules')">종목별 규칙</button>
    </div>

    <!-- 1. 일정 탭 -->
    <div id="tab-schedule" class="tab-content active">
      <div class="grade-selector">
        <button class="grade-btn active" data-grade="3" onclick="filterGrade(3)">3학년</button>
        <button class="grade-btn" data-grade="2" onclick="filterGrade(2)">2학년</button>
        <button class="grade-btn" data-grade="1" onclick="filterGrade(1)">1학년</button>
      </div>
      <div id="timeline-list" class="timeline"></div>
    </div>

    <!-- 2. 배점 및 결과 탭 -->
    <div id="tab-result" class="tab-content">
      <!-- 관리자 인증 영역 -->
      <div id="admin-auth-container" class="card-box auth-box">
        <h3>🔒 관리자 전용 영역</h3>
        <p style="font-size:0.9rem; color:var(--text-sub); margin: 10px 0 15px 0;">배점 입력 및 결과를 확인하려면 비밀번호를 입력해 주세요.</p>
        <div>
          <input type="password" id="admin-pass-input" placeholder="비밀번호 입력">
          <button onclick="checkAdminPassword()">인증</button>
        </div>
      </div>

      <!-- 인증 후 나타나는 배점 결과 영역 -->
      <div id="admin-content-container" style="display: none;">
        <div class="card-box">
          <div style="display:flex; justify-shadow:space-between; align-items:center; margin-bottom:12px;">
            <h3>📊 학년별/반별 배점 종합 점수</h3>
            <button onclick="lockAdmin()" style="padding:6px 12px; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">잠금 🔒</button>
          </div>

          <!-- 학년 선택 -->
          <div class="grade-selector">
            <button class="grade-btn result-grade-btn active" data-grade="3" onclick="switchResultGrade(3)">3학년</button>
            <button class="grade-btn result-grade-btn" data-grade="2" onclick="switchResultGrade(2)">2학년</button>
            <button class="grade-btn result-grade-btn" data-grade="1" onclick="switchResultGrade(1)">1학년</button>
          </div>

          <div class="table-responsive">
            <table class="score-table">
              <thead>
                <tr id="calc-table-header">
                  <!-- JS Dynamic Header -->
                </tr>
              </thead>
              <tbody id="calc-table-body">
                <!-- JS Dynamic Body -->
              </tbody>
            </table>
          </div>

          <h4 style="margin-top: 20px; color:#2d3748;">🏆 최종 실시간 총점 (1~10반)</h4>
          <div class="total-score-grid" id="total-score-board">
            <!-- JS Dynamic Total Score Cards -->
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 규칙 탭 -->
    <div id="tab-rules" class="tab-content">
      <div class="rule-accordion" id="rule-accordion-list">
        <!-- JS Dynamic Rules -->
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <footer id="footer-school">덕소중학교</footer>

      { title: "🏐 전원참여 피구 (체육관)", location: "체육관", content: `• 학급 전원 참가 (남/여 구분 경기 후 합산 점수 반영)\n• 경기 시간: 전반/후반 각 7분\n• 공격 시 아웃된 주자는 상대 진영 외야로 이동\n• 얼굴, 머리 맞출 시 노아웃(공격권 이관)\n• 라인 터치 시 상대편 공격권 이관` },
      { title: "🧩 단체 경기 1: 파이프 연결 (운동장)", location: "운동장", content: `• 반 전체 참가\n• 파이프 반원 관을 서로 이어 붙여 탁구공/골프공을 끊이지 않고 목표 지점까지 이송\n• 공이 바닥에 떨어질 경우 출발선 또는 이전 체크포인트에서 재출발\n• 제한시간 내에 지정된 구역을 통과한 순서대로 순위 결정` },
      { title: "🎯 단체 경기 2: 플라잉디스크 윷놀이 (운동장)", location: "운동장", content: `• 학급 대표 및 단체 참가\n• 플라잉디스크를 던져 윷놀이 판(도, 개, 걸, 윷, 모, 백도)에 착지시켜 말 이동\n• 상대 말을 잡거나 먼저 도착 지점에 모든 말이 들어오는 반이 승리` },
      { title: "🔔 협동 챌린지: 체육 골든벨 (각반 교실)", location: "각 반 교실", content: `• TV 방송 또는 방송반 주관 진행\n• 체육 상식, 학교 역사, 올림픽 관련 문제 출제\n• 화이트보드에 답을 적어 제출, 누적 정답 수가 가장 높은 반이 우승` },
      { title: "🪢 학년별 단체 줄넘기 (운동장)", location: "운동장", content: `• 줄돌리기 2명 + 뛰기 인원 참가\n• 제한시간 3분 동안 걸리지 않고 연속으로 많이 뛴 횟수를 측정\n• 총 2회 시도 중 더 높은 기록 반영` },
      { title: "🏃‍♂️ 학년별 이어달리기 결승 (운동장)", location: "운동장", content: `• 반별 대표 주자 참가\n• 바통 존(Passing Zone) 내에서 안전하게 바통을 주고받아야 함\n• 주로 이탈 및 고의적 방해 행위 발생 시 감점 또는 자격 박탈` }
    ];

    let currentSelectedGrade = 3;

    /* ===================================================
       [초기화 및 로직]
       =================================================== */
    window.addEventListener("DOMContentLoaded", () => {
      initHeaderInfo();
      calculateDDay();
      renderSchedule(currentSelectedGrade);
      renderRules();
      initScoresStorage();
    });

    function initHeaderInfo() {
      document.getElementById("event-title").innerText = EVENT_DATA.title;
      document.getElementById("event-info").innerText = `📅 일시: ${EVENT_DATA.date} (${EVENT_DATA.time})\n📍 장소: ${EVENT_DATA.location}`;
      document.getElementById("footer-school").innerText = EVENT_DATA.school;
    }

    function calculateDDay() {
      const today = new Date();
      const targetDate = new Date(EVENT_DATA.date);
      today.setHours(0,0,0,0);
      targetDate.setHours(0,0,0,0);

      const diffTime = targetDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      const ddayBadge = document.getElementById("dday-badge");
      if (diffDays > 0) {
        ddayBadge.innerText = `D-${diffDays}`;
      } else if (diffDays === 0) {
        ddayBadge.innerText = "D-DAY (오늘!) 🔥";
      } else {
        ddayBadge.innerText = `D+${Math.abs(diffDays)}`;
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(content => content.classList.remove("active"));

      const indexMap = { 'schedule': 0, 'result': 1, 'rules': 2 };
      document.querySelectorAll(".tab-btn")[indexMap[tabName]].classList.add("active");
      document.getElementById(`tab-${tabName}`).classList.add("active");
    }

    function filterGrade(grade) {
      currentSelectedGrade = grade;
      document.querySelectorAll(".grade-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelector(`.grade-btn[data-grade="${grade}"]`).classList.add("active");
      renderSchedule(grade);
    }

    function renderSchedule(grade) {
      const timelineList = document.getElementById("timeline-list");
      timelineList.innerHTML = "";

      SCHEDULE_DATA.forEach(item => {
        const gradeInfo = item.grades[grade];
        const card = document.createElement("div");
        card.className = `timeline-item grade-${grade}`;

        let locText = item.location || "";
        let titleText = "";

        if (typeof gradeInfo === "object" && gradeInfo !== null) {
          locText = gradeInfo.location;
          titleText = gradeInfo.title;
        } else {
          titleText = gradeInfo;
        }

        card.innerHTML = `
          <div class="time-header">
            <span>⏰ ${item.time} ${item.order !== '-' ? `(순서 ${item.order})` : ''}</span>
            <span class="location-tag">📍 ${locText}</span>
          </div>
          <div class="event-title">${titleText.replace(/\n/g, '<br>')}</div>
        `;

        timelineList.appendChild(card);
      });
    }

    /* 관리자 인증 기능 */
    function checkAdminPassword() {
      const input = document.getElementById("admin-pass-input").value;
      if (input === ADMIN_PW) {
        isAdminAuthenticated = true;
        document.getElementById("admin-auth-container").style.display = "none";
        document.getElementById("admin-content-container").style.display = "block";
        document.getElementById("admin-pass-input").value = "";
        renderResultTable();
      } else {
        alert("비밀번호가 올바르지 않습니다.");
        document.getElementById("admin-pass-input").value = "";
      }
    }

    function lockAdmin() {
      isAdminAuthenticated = false;
      document.getElementById("admin-auth-container").style.display = "block";
      document.getElementById("admin-content-container").style.display = "none";
    }

    /* 점수표 초기화 및 렌더링 */
    function initScoresStorage() {
      [1, 2, 3].forEach(g => {
        SCORE_CALC_ITEMS.forEach((_, itemIdx) => {
          if (!SCORES_DATA[g][itemIdx]) SCORES_DATA[g][itemIdx] = {};
          for (let c = 1; c <= 10; c++) {
            if (!SCORES_DATA[g][itemIdx][c]) SCORES_DATA[g][itemIdx][c] = 0;
          }
        });
      });
    }

    function switchResultGrade(grade) {
      selectedResultGrade = grade;
      document.querySelectorAll(".result-grade-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelector(`.result-grade-btn[data-grade="${grade}"]`).classList.add("active");
      renderResultTable();
    }

    function renderResultTable() {
      if (!isAdminAuthenticated) return;

      // 헤더 렌더링 (종목명 + 1~10반)
      const headerTr = document.getElementById("calc-table-header");
      headerTr.innerHTML = `<th>종목명</th>` + Array.from({length: 10}, (_, i) => `<th>${i+1}반</th>`).join('');

      // 바디 렌더링
      const tbody = document.getElementById("calc-table-body");
      tbody.innerHTML = "";

      SCORE_CALC_ITEMS.forEach((item, itemIdx) => {
        const tr = document.createElement("tr");
        let classOptionsHTML = '';

        for (let cls = 1; cls <= 10; cls++) {
          const currentRank = SCORES_DATA[selectedResultGrade][itemIdx][cls] || 0;
          classOptionsHTML += `
            <td>
              <select class="rank-select" onchange="updateRank(${selectedResultGrade}, ${itemIdx}, ${cls}, this.value)">
                <option value="0">선택</option>
                ${Array.from({length: 10}, (_, r) => `<option value="${r+1}" ${currentRank === (r+1) ? 'selected' : ''}>${r+1}등</option>`).join('')}
              </select>
            </td>
          `;
        }

        tr.innerHTML = `<td style="font-weight:700; white-space:nowrap;">${item.name}</td>` + classOptionsHTML;
        tbody.appendChild(tr);
      });

      updateTotalScoresBoard();
    }

    function updateRank(grade, itemIdx, cls, rankVal) {
      SCORES_DATA[grade][itemIdx][cls] = parseInt(rankVal);
      updateTotalScoresBoard();
    }

    function updateTotalScoresBoard() {
      const classTotals = {};
      for (let c = 1; c <= 10; c++) classTotals[c] = 0;

      SCORE_CALC_ITEMS.forEach((item, itemIdx) => {
        for (let cls = 1; cls <= 10; cls++) {
          const rank = SCORES_DATA[selectedResultGrade][itemIdx][cls];
          if (rank > 0) {
            classTotals[cls] += item.scores[rank] || 0;
          }
        }
      });

      const maxScore = Math.max(...Object.values(classTotals));
      const board = document.getElementById("total-score-board");
      board.innerHTML = "";

      for (let cls = 1; cls <= 10; cls++) {
        const score = classTotals[cls];
        const isLeader = score > 0 && score === maxScore;
        const card = document.createElement("div");
        card.className = `class-score-card ${isLeader ? 'rank-1' : ''}`;
        card.innerHTML = `
          <div class="class-name">${cls}반 ${isLeader ? '👑' : ''}</div>
          <div class="score-num">${score}점</div>
        `;
        board.appendChild(card);
      }
    }

    function renderRules() {
      const container = document.getElementById("rule-accordion-list");
      container.innerHTML = "";

      RULES_DATA.forEach((rule, idx) => {
        const item = document.createElement("div");
        item.className = "rule-item";
        item.innerHTML = `
          <div class="rule-header" onclick="toggleRule(${idx})">
            <span><span class="rule-tag">${rule.location}</span>${rule.title}</span>
            <span>▼</span>
          </div>
          <div class="rule-content">
            ${rule.content.replace(/\n/g, '<br>')}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function toggleRule(index) {
      const items = document.querySelectorAll(".rule-item");
      items[index].classList.toggle("active");
    }
  </script>
</body>
</html>
